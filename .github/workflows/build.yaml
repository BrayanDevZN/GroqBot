name: build

on:

    push:

        branches:
            - main
    
    pull_request:
        branches:
            - main

jobs:

    build:

        runs-on: ubuntu-latest

        services:

            redis:

                image: redis:alpine
                ports:
                    - 6379:6379

        environment: test

        steps:

            - uses: actions/checkout@v4

            - uses: actions/setup-python@v5

            
              env:
                test: ${{ secrets.TEST }}
                brapi_key: ${{ secrets.BRAPI_KEY }}
                groq_key: ${{ secrets.GROQ_KEY }}

            - name: install depends
              run: pip install -r requirements.txt

            - name: execute
              run: |
               python -m tests.redis
               python -m tests.brapi






